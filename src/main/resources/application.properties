spring.application.name=tienda-web-backend
server.port=8080

# PostgreSQL Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bd_sistema_negocio}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Cloudinary Configuration (credenciales por variables de entorno)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Multipart (subida de imagenes de productos y comprobantes)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Carga opcional de .env local para tokens/credenciales sin exponer secretos en Git
spring.config.import=optional:file:.env[.properties],optional:file:tienda_web_backend/.env[.properties]

# Consultas RENIEC / SUNAT (Adapter Backend)
apisperu.token=${APIPERU_TOKEN:}
apisnetpe.token=${APISNETPE_TOKEN:}



