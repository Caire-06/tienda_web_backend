spring.application.name=tienda-web-backend
server.port=${PORT:8080}

# ==============================================================================
# Base de Datos PostgreSQL (Producción en Render / Local vía .env)
# Nunca escribas contraseñas reales en este archivo.
# ==============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Referencia para seguir en LOCAL (configúralo en tienda_web_backend/.env) ---
# SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/bd_sistema_negocio
# SPRING_DATASOURCE_USERNAME=postgres
# SPRING_DATASOURCE_PASSWORD=TU_PASSWORD_POSTGRES_LOCAL

# ==============================================================================
# JPA / Hibernate (logs SQL desactivados por defecto en producción)
# En local puedes activar JPA_SHOW_SQL=true desde tienda_web_backend/.env
# ==============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==============================================================================
# Seguridad CORS (Render Static Site + Local Vite)
# En Render define: CORS_ALLOWED_ORIGINS=https://tu-frontend.onrender.com
# En local se permite Vite por defecto:
# ==============================================================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

# ==============================================================================
# Semilla inicial de cuentas privilegiadas (solo si se definen en .env / Render)
# En producción usa claves fuertes en Render o deja vacío si ya existen en BD.
# ==============================================================================
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}
app.seed.almacen-password=${SEED_ALMACEN_PASSWORD:}

# Cloudinary Configuration (credenciales por variables de entorno)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.url=${CLOUDINARY_URL:}

# Multipart (subida de imagenes de productos y comprobantes)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Carga opcional de .env local para tokens/credenciales sin exponer secretos en Git
spring.config.import=optional:file:.env[.properties],optional:file:tienda_web_backend/.env[.properties],optional:file:../.env[.properties]

# Consultas RENIEC / SUNAT (Adapter Backend)
apisperu.token=${APIPERU_TOKEN:}
apisnetpe.token=${APISNETPE_TOKEN:}
